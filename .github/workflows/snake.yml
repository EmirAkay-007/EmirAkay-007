name: Contribution snake

on:
  schedule:
    - cron: "17 3 * * *"   # once a day
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Draw the snake from the contribution calendar
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#F2B544&color_dots=#0E1A33,#16306B,#1B3F8B,#3F74D6,#7FB2FF
            dist/snake-light.svg?color_snake=#0B1F4B&color_dots=#EAF0FB,#BBD0F5,#7FA6EC,#3F74D6,#1B3F8B

      - name: Publish to the output branch
        run: |
          cd dist
          git init -q -b output
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Update contribution snake"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" output
